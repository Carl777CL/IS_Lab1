name: Security CI Pipeline

on: [push]

jobs:
  security-scan:
    runs-on: ubuntu-24.04 
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -r requirements.txt

      - name: Run SAST (Bandit)
        run: |
          bandit app.py -f txt -o bandit-report.txt || true
          cat bandit-report.txt

      - name: Run SCA (pip-audit)
        run: |
          pip-audit -r requirements.txt -f columns > dependency-report.txt || true
          cat dependency-report.txt

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.txt

      - name: Upload Dependency Report
        uses: actions/upload-artifact@v7
        with:
          name: dependency-report
          path: dependency-report.txt